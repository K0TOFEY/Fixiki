<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img" aria-labelledby="title description">
  <title id="title">Архитектура проекта контроля качества — вариант 4</title>
  <desc id="description">Вертикальная схема сверху вниз: входные данные, Flask, расчёты и хранение, затем визуализация отчётов в браузере.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3f626a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24343a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #5b6b70; }
      .step { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #42636a; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 16px; }
      .note { font-size: 14px; fill: #53636a; }
      .card { fill: #fff; stroke: #ccd6d4; stroke-width: 2; }
      .blue { fill: #eaf2f4; stroke: #bfd0d4; stroke-width: 2; }
      .green { fill: #edf4ef; stroke: #cad9ce; stroke-width: 2; }
      .sand { fill: #f5f1e8; stroke: #ded5c3; stroke-width: 2; }
      .arrow { stroke: #3f626a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="1600" fill="#f5f7f5"/>
  <text x="64" y="72" class="title">Архитектура проекта контроля качества</text>
  <text x="64" y="107" class="subtitle">Вариант 4 · единый поток сверху вниз</text>

  <rect x="200" y="155" width="1000" height="205" rx="18" class="sand"/>
  <text x="240" y="195" class="step">1 · ВХОДНЫЕ ДАННЫЕ</text>
  <text x="240" y="235" class="head">Файлы с историей изделий</text>
  <text x="240" y="275" class="body">CSV: дата-время, метка качества, показания датчиков</text>
  <text x="240" y="307" class="body">или синхронная пара: features.data + labels.data</text>
  <text x="240" y="339" class="note">Загрузка пользователем или чтение ранее сохранённых файлов при запуске</text>

  <path d="M700 360 V415" class="arrow"/>
  <text x="725" y="395" class="note">файл</text>

  <rect x="200" y="425" width="1000" height="205" rx="18" class="blue"/>
  <text x="240" y="465" class="step">2 · ВЕБ-СЛОЙ</text>
  <text x="240" y="505" class="head">Flask · dashboard.py</text>
  <text x="240" y="545" class="body">Принимает запросы и загрузки, проверяет вход, выбирает страницу и период</text>
  <text x="240" y="577" class="body">После загрузки вызывает чтение данных и расчёт показателей</text>
  <text x="240" y="609" class="note">Выбранные даты хранятся в сессии браузера</text>

  <path d="M700 630 V685" class="arrow"/>
  <text x="725" y="665" class="note">валидированные данные</text>

  <rect x="200" y="695" width="1000" height="255" rx="18" class="green"/>
  <text x="240" y="735" class="step">3 · ОБРАБОТКА И АНАЛИТИКА</text>
  <text x="240" y="775" class="head">functions.py</text>
  <text x="240" y="815" class="body">Сортировка по времени и очистка датчиков</text>
  <text x="240" y="847" class="body">Статистические границы, недельные показатели и сигналы</text>
  <text x="240" y="879" class="body">Рейтинги датчиков и экспериментальная модель классификации</text>
  <text x="240" y="919" class="note">Расчёты выполняются для набора при загрузке или запуске</text>

  <path d="M700 950 V1005" class="arrow"/>
  <text x="725" y="985" class="note">результаты</text>

  <rect x="200" y="1015" width="1000" height="190" rx="18" class="card"/>
  <text x="240" y="1055" class="step">4 · ХРАНЕНИЕ</text>
  <text x="240" y="1095" class="head">Файлы на диске + STATE в памяти процесса</text>
  <text x="240" y="1135" class="body">Загруженные файлы сохраняются локально в data/</text>
  <text x="240" y="1167" class="body">Текущий набор и рассчитанные таблицы хранятся в памяти</text>
  <text x="240" y="1193" class="note">Отдельной базы результатов нет</text>

  <path d="M700 1205 V1260" class="arrow"/>
  <text x="725" y="1240" class="note">данные для страницы</text>

  <rect x="200" y="1270" width="1000" height="190" rx="18" class="blue"/>
  <text x="240" y="1310" class="step">5 · ПРЕДСТАВЛЕНИЕ</text>
  <text x="240" y="1350" class="head">charts.py + templates/</text>
  <text x="240" y="1390" class="body">Plotly строит графики; Jinja формирует HTML-страницы и таблицы</text>
  <text x="240" y="1422" class="body">Браузер пользователя отображает результат с помощью Plotly.js и CSS</text>
  <text x="240" y="1448" class="note">Flask возвращает готовую страницу по запросу</text>

  <rect x="64" y="1500" width="1272" height="64" rx="12" fill="#f5f1e8" stroke="#ded5c3" stroke-width="2"/>
  <text x="92" y="1539" class="body">Границы прототипа: нет подключения к линии, ERP/MES, автоматических оповещений и журнала действий.</text>
</svg>
